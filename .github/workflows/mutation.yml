name: Mutation Testing

# Stryker is slow (it re-runs the test suite per mutant), so it does NOT gate
# every PR. It runs on demand and weekly to track the mutation score of the
# security-critical core validators — surfacing weak assertions that line/branch
# coverage (already enforced at 100%) cannot detect.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker (core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job: don't write the GITHUB_TOKEN into .git/config
          # where later steps (or compromised dev-dep code) could read it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker on @sentinel-password/core
        # Activate the Stryker Dashboard reporter only when the API key secret is
        # present, so the score is published for the README badge. Without the
        # secret (e.g. before it's configured, or on forks) the run still works —
        # it just skips the upload instead of erroring.
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          if [ -n "$STRYKER_DASHBOARD_API_KEY" ]; then
            pnpm --filter @sentinel-password/core exec stryker run --reporters clear-text,progress,html,dashboard
          else
            echo "::notice::STRYKER_DASHBOARD_API_KEY not set — running without dashboard upload."
            pnpm --filter @sentinel-password/core test:mutation
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: packages/core/reports/mutation/
          if-no-files-found: ignore
