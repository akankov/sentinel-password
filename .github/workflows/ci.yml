name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        # 20 stays while `engines: >=20` is the published support floor;
        # 26 is Current. 25 (odd-numbered) reached EOL June 2026.
        node-version: [20, 22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Read-only job: don't write the GITHUB_TOKEN into .git/config
          # where later steps (or compromised dev-dep code) could read it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # No standalone `pnpm test` step: the five per-package coverage runs
      # below execute the exact same suites (core, entropy, breach, react,
      # react-components are the only packages with a test script), so a
      # separate test step would run everything twice per matrix job.
      - name: Coverage (core, 100% threshold enforced)
        run: pnpm --filter @sentinel-password/core test:coverage

      - name: Coverage (entropy, 100% threshold enforced)
        run: pnpm --filter @sentinel-password/entropy test:coverage

      - name: Coverage (breach, 100% threshold enforced)
        run: pnpm --filter @sentinel-password/breach test:coverage

      - name: Coverage (react)
        run: pnpm --filter @sentinel-password/react test:coverage

      - name: Coverage (react-components)
        run: pnpm --filter @sentinel-password/react-components test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 24
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: packages/core/coverage/lcov.info,packages/entropy/coverage/lcov.info,packages/breach/coverage/lcov.info,packages/react/coverage/lcov.info,packages/react-components/coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Read-only job: don't write the GITHUB_TOKEN into .git/config
          # where later steps (or compromised dev-dep code) could read it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check core bundle size
        run: |
          CORE_SIZE=$(gzip -c packages/core/dist/index.js | wc -c)
          CORE_SIZE_KB=$(echo "scale=2; $CORE_SIZE / 1024" | bc)
          echo "Core bundle size: ${CORE_SIZE_KB}KB gzipped"

          # Fail if over 10KB (10240 bytes)
          if [ "$CORE_SIZE" -gt 10240 ]; then
            echo "::error::Core bundle size ${CORE_SIZE_KB}KB exceeds 10KB limit"
            exit 1
          fi

          echo "::notice::Core bundle size ${CORE_SIZE_KB}KB is within 10KB limit"

      - name: Check entropy bundle size
        run: |
          ENTROPY_SIZE=$(gzip -c packages/entropy/dist/index.js | wc -c)
          ENTROPY_SIZE_KB=$(echo "scale=2; $ENTROPY_SIZE / 1024" | bc)
          echo "Entropy bundle size: ${ENTROPY_SIZE_KB}KB gzipped"

          # Fail if over 30KB (30720 bytes)
          if [ "$ENTROPY_SIZE" -gt 30720 ]; then
            echo "::error::Entropy bundle size ${ENTROPY_SIZE_KB}KB exceeds 30KB limit"
            exit 1
          fi

          echo "::notice::Entropy bundle size ${ENTROPY_SIZE_KB}KB is within 30KB limit"

      - name: Check breach bundle size
        run: |
          BREACH_SIZE=$(gzip -c packages/breach/dist/index.js | wc -c)
          BREACH_SIZE_KB=$(echo "scale=2; $BREACH_SIZE / 1024" | bc)
          echo "Breach bundle size: ${BREACH_SIZE_KB}KB gzipped"

          # Fail if over 10KB (10240 bytes)
          if [ "$BREACH_SIZE" -gt 10240 ]; then
            echo "::error::Breach bundle size ${BREACH_SIZE_KB}KB exceeds 10KB limit"
            exit 1
          fi

          echo "::notice::Breach bundle size ${BREACH_SIZE_KB}KB is within 10KB limit"

      - name: Check generate bundle size
        run: |
          GENERATE_SIZE=$(gzip -c packages/generate/dist/index.js | wc -c)
          GENERATE_SIZE_KB=$(echo "scale=2; $GENERATE_SIZE / 1024" | bc)
          echo "Generate bundle size: ${GENERATE_SIZE_KB}KB gzipped"

          # Fail if over 10KB (10240 bytes)
          if [ "$GENERATE_SIZE" -gt 10240 ]; then
            echo "::error::Generate bundle size ${GENERATE_SIZE_KB}KB exceeds 10KB limit"
            exit 1
          fi

          echo "::notice::Generate bundle size ${GENERATE_SIZE_KB}KB is within 10KB limit"

  package-quality:
    name: Package Quality
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Read-only job: don't write the GITHUB_TOKEN into .git/config
          # where later steps (or compromised dev-dep code) could read it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (fails on high/critical)
        run: pnpm audit --prod --audit-level high

      - name: Unused files, exports, and dependencies (knip)
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Validate published package shape (publint)
        run: pnpm publint

      - name: Validate published types (are-the-types-wrong)
        run: pnpm attw
