# Dependabot configuration for sentinel-password monorepo
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # All workspace manifests: root, every package, and every example.
  # The `directories` globs cover nested workspace package.json files that a
  # single `directory: '/'` entry would not propose updates for (per-package
  # devDeps like docs' vitepress/vue and each example's own dependency tree).
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/*'
      - '/examples/*'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react 7.37.5 is incompatible with ESLint 10
      # (calls context.getFilename() which ESLint 10 removed).
      # Pin examples on eslint 9 until the plugin ships a v10-compatible release.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
        exclude-patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
      include: 'scope'
