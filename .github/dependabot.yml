# Dependabot configuration for sentinel-password monorepo
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Single root entry: pnpm-workspace.yaml covers packages/* and examples/*,
  # so Dependabot traverses every workspace manifest from '/' and updates the
  # shared pnpm-lock.yaml alongside each package.json. Per-directory entries
  # must not be added back: they propose the same bumps without lockfile
  # access, so their PRs always fail CI's `pnpm install --frozen-lockfile`.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react 7.37.5 is incompatible with ESLint 10
      # (calls context.getFilename() which ESLint 10 removed).
      # Pin examples on eslint 9 until the plugin ships a v10-compatible release.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
        exclude-patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
      include: 'scope'
