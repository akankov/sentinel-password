# Dependabot configuration for sentinel-password monorepo
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Single root entry: pnpm-workspace.yaml covers packages/* and examples/*,
  # so Dependabot traverses every workspace manifest from '/' and updates the
  # shared pnpm-lock.yaml alongside each package.json. Per-directory entries
  # must not be added back: they propose the same bumps without lockfile
  # access, so their PRs always fail CI's `pnpm install --frozen-lockfile`.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 5
    # Match pnpm-workspace.yaml's minimumReleaseAge (10080 min = 7 days).
    # Without this Dependabot proposes versions younger than the cooling-off
    # window, which pnpm then refuses to resolve (ERR_PNPM_NO_MATURE_MATCHING_VERSION),
    # so the PR can never regenerate a lockfile and always fails CI.
    cooldown:
      default-days: 7
    ignore:
      # eslint-plugin-import 2.32.0 reads the removed context.parserOptions and
      # throws at rule-load time under ESLint 10; eslint-plugin-jsx-a11y 6.10.2
      # has not widened its peer range either. Both are enabled by
      # eslint-config-next, so examples/nextjs stays on eslint 9 until they ship
      # v10-compatible releases.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
        exclude-patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 3
    ignore:
      # release.yml only triggers on push to main, so no PR check can ever
      # execute this action — a breaking major merges green and fails on the
      # merge commit. changesets/action v2 did exactly that: it requires
      # Changesets CLI v3 and renamed every input the workflow passes
      # (version -> version-script, publish -> publish-script, commit ->
      # commit-message, title -> pr-title, createGithubReleases ->
      # create-github-releases). Majors here get migrated by hand, together
      # with the @changesets/cli bump, never proposed unattended.
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore'
      include: 'scope'
