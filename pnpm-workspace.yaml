packages:
  - 'packages/*'
  - 'examples/*'

# Migrated from the package.json "pnpm" field, which pnpm 10.33.1 no longer
# reads (it warns "the pnpm field ... is no longer read"). These must live here
# so the vite/postcss CVE overrides stay applied on lockfile regeneration.
overrides:
  vite@<6.4.3: ^6.4.3
  # GHSA-fxqj-rqcc-2cmp is the incomplete-fix follow-up that moved the floor
  # past the old 8.5.18 ceiling: an attacker-controlled sourceMappingURL reads
  # an arbitrary .map off disk when `from` is unset. Raising rather than
  # deleting matters here — next pins postcss at exactly 8.4.31, so this
  # selector is what lifts the tree at all; dropping it regresses to 8.4.31.
  postcss@<8.5.23: ^8.5.23
  # postcss declares `nanoid: ^3.3.16` at 8.5.23, 8.5.24 and 8.5.25 alike, so
  # bumping postcss does NOT raise the nanoid floor — pnpm keeps the satisfying
  # lockfile entry. Only this explicit line closes GHSA-2v37-7h3g-55p8 (custom
  # generators loop forever when size is 0), the sole advisory that was failing
  # `pnpm audit --prod --audit-level high` via next > postcss > nanoid.
  # Re-scoped upstream 2026-08-13 from <3.3.17 to <3.3.18: the selector kept
  # firing (it matches postcss's declared `^3.3.16`, not the installed version),
  # but `^3.3.17` was already satisfied by the locked 3.3.17, so nothing moved.
  # It is the replacement value that goes stale here — raise both halves together.
  nanoid@<3.3.18: ^3.3.18
  # No nanoid 4.x/5.x requester today; floors the branch pre-emptively.
  'nanoid@>=4.0.0 <5.1.6': ^5.1.6
  esbuild@<0.28.1: ^0.28.1
  qs@<6.15.2: ^6.15.2
  # Five advisories dated 2026-08-03 (GHSA-4cwx-7wf7-3272 high, plus four
  # moderate) set the 7.x floor at 7.29.0 and the 8.x floor at 8.9.0. Two
  # selectors rather than one `<8.9.0`: a single range would rewrite a
  # legitimate 7.x request across a major boundary. jsdom 30 requires
  # undici ^8.9.0, so the 8.x line is the live one and the 7.x line is a
  # dormant floor guarding against anything reintroducing undici 7.
  undici@<7.29.0: ^7.29.0
  'undici@>=8.0.0 <8.9.0': ^8.9.0
  '@babel/core@<7.29.6': ^7.29.6
  # GHSA-5p4m-2wfm-xmqj: quadratic resolveYamlOmap(). !!omap lives in the
  # DEFAULT schema, so a plain yaml.load() is affected. Reached via changesets
  # and @eslint/eslintrc.
  js-yaml@4: ^4.3.1
  # Two further advisories since the 5.0.7/1.1.16 ceilings were set
  # (GHSA-mh99-v99m-4gvg, then GHSA-rgw5-rvv9-x895 which bypassed its
  # mitigation). Both reached via minimatch under eslint, so dev-scope only —
  # GitHub auto-dismisses them and `pnpm audit --prod` cannot see them, which
  # is exactly why they drifted two patches behind unnoticed.
  'brace-expansion@>=5.0.0 <5.0.9': ^5.0.9
  brace-expansion@<1.1.18: ^1.1.18
  # GHSA-7p8r-x3mc-p8w7: backslash-as-authority host confusion defeats URL
  # allowlists. Reached only via ajv under Stryker.
  fast-uri@<3.1.5: ^3.1.5
  # No fast-uri 4.x requester today (ajv asks ^3.0.1); floors the branch
  # pre-emptively in case an ajv major moves onto it.
  'fast-uri@>=4.0.0 <4.1.2': ^4.1.2
  'body-parser@>=2.0.0 <2.3.0': ^2.3.0
  # eslint-config-next asks for ^3.5.2, but the whole 3.x line ships without
  # provenance and trips trustPolicy: no-downgrade on any lockfile regen. 4.x
  # is provenance-attested and declares identical peers ('*' for eslint,
  # eslint-plugin-import, eslint-plugin-import-x).
  eslint-import-resolver-typescript@3: ^4.4.5
  # next pins sharp ^0.34.5 as an optional dep, but the libvips CVEs are only
  # fixed in 0.35.0+. next only lazy-requires sharp inside the runtime image
  # optimizer, and next 16.3 canaries already moved to ^0.35.3.
  sharp@<0.35.0: ^0.35.3
  # read-yaml-file 1.x pins the EOL js-yaml 3 (removed safeLoad API); 2.1.0 is
  # still CommonJS but uses js-yaml 4, dropping the last js-yaml 3 in the tree
  # (only reached via @changesets/cli > @manypkg/get-packages@1.1.3).
  read-yaml-file@<2.1.0: ^2.1.0

# Allowlist the only dependency permitted to run its install/build script
# (pnpm 10 blocks lifecycle scripts by default).
onlyBuiltDependencies:
  - esbuild

# Cooling-off window (minutes) before a freshly-published registry version is
# eligible for resolution — 7 days shields against npm-worm-style attacks
# where a compromised maintainer account ships malware that's usually yanked
# within hours/days. Does not affect `--frozen-lockfile` CI installs (no
# resolution) or workspace-linked packages; at worst a Dependabot bump waits
# out the window (its cadence here is weekly anyway).
minimumReleaseAge: 10080

# Refuse transitive dependencies resolved from exotic sources (git/URL
# tarballs) that bypass registry integrity guarantees.
blockExoticSubdeps: true

# Refuse a version whose npm publisher trust evidence is weaker than that of
# any earlier-published version of the same package (trusted publisher >
# provenance attestation > none), which can signal a takeover. Comparison is by
# publish date, not semver, and it only fires when a package is actually
# re-resolved — `--frozen-lockfile` skips the resolver entirely.
# NB: pnpm 11.3+ additionally verifies every lockfile entry on frozen installs,
# so a pnpm major bump will need `trustLockfile: true` or CI will break.
trustPolicy: no-downgrade

# Narrow, documented exemptions from the check above. Keep this list short and
# justify every entry — each one is a hole in the policy.
trustPolicyExclude:
  # False positive. semver 7.5.1-7.5.4 (Apr-Jul 2023) carry provenance, and
  # 6.3.1 shipped 2023-07-10, three days after 7.5.4 — so the date-ordered
  # comparison reads a maintenance backport on the frozen 6.x branch (which
  # does not run the provenance-enabled release workflow) as a downgrade.
  # Same npm-maintained node-semver repo; integrity is pinned in the lockfile.
  # Forcing semver 7 instead would be a real behavioural risk for no gain.
  - 'semver@6.3.1'
